<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta tags (overridden per-route by the <Seo /> component) -->
    <title>FileFlow — Modern, cloud-based file management.</title>
    <meta
      name="description"
      content="FileFlow is a modern, cloud-based file management system. Upload, organize, share, and manage your files, videos, images, and documents with real-time notifications and advanced access control."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://fileflow.nerchuko.in/" />

    <!-- Icons & PWA -->
    <link rel="icon" type="image/png" href="/fileflow_favicon.png" />
    <link rel="apple-touch-icon" href="/fileflow_favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FileFlow" />
    <meta property="og:title" content="FileFlow — Modern, cloud-based file management." />
    <meta
      property="og:description"
      content="Upload, organize, share, and manage your files, videos, images, and documents with real-time notifications and advanced access control."
    />
    <meta property="og:url" content="https://fileflow.nerchuko.in/" />
    <meta property="og:image" content="https://fileflow.nerchuko.in/og-image.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FileFlow — Modern, cloud-based file management." />
    <meta
      name="twitter:description"
      content="Upload, organize, share, and manage your files, videos, images, and documents with real-time notifications and advanced access control."
    />
    <meta name="twitter:image" content="https://fileflow.nerchuko.in/og-image.png" />

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "FileFlow",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://fileflow.nerchuko.in/",
        "description": "FileFlow is a modern, cloud-based file management system. Upload, organize, share, and manage your files, videos, images, and documents with real-time notifications and advanced access control.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
